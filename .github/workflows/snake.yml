name: Generate Snake Animation

# izinkan Action untuk push file ke repo
permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *"   # update sekali sehari (UTC). Ganti kalau mau frekuensi lain
  workflow_dispatch:      # memungkinkan run manual dari UI
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate snake SVG (Platane/snk)
        uses: Platane/snk/svg-only@v3
        with:
          # gunakan owner repo (otomatis)
          github_user_name: ${{ github.repository_owner }}
          # hasil output; kita set palette & warna snake sesuai tema #0ba9b4
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=0ba9b4

      - name: Publish `dist/` to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
